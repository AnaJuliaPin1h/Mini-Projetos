<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampada</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>VANILLA JS</h1>
    </header>
    
    <main>
        <div>
            <img src="./Img/imagemdesligado.png" height="400" alt="Lampada" id="lamp">
        </div>

        <div>
            <button id="on">Ligar</button>
            <button id="off">Desligar</button>
        </div>
    </main>
    <script src="./lampada.js"></script>

    <!--
        Ligar e Desligar conforme os botões,
        ao passar o mouse ele liga,
        duplo clique a lampada quebra,
        com a lampada quebrada nao vai ter acesso
        a outras ações.
        Recarregando a pagina a lanterna volta ao normal.
    -->
</body>
</html>
